<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#080c16"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="tealGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".75"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".85"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="10"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes floatCard1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(.5deg)}}@keyframes floatCard2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(12px) rotate(-.5deg)}}@keyframes waveFlow{0%{transform:translateX(0)}50%{transform:translateX(-30px)}}@keyframes pillPulse{0%{opacity:.7;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}.pulsing-orb-1{animation:pulseGlow 6s ease-in-out infinite;transform-origin:200px 100px}.pulsing-orb-2{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:1000px 260px}.floating-card-1{animation:floatCard1 7s ease-in-out infinite}.floating-card-2{animation:floatCard2 8s ease-in-out infinite}.pulse-pill-1{animation:pillPulse 5s ease-in-out infinite}.pulse-pill-2{animation:pillPulse 6s ease-in-out infinite 1.5s}.pulse-pill-3{animation:pillPulse 5.5s ease-in-out infinite 3s}.flow-line{stroke-dasharray:8,8;animation:dashMove 3s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><g stroke="#fff" stroke-width="1" opacity=".08"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="450" x2="450" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="750" x2="750" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="180" cy="90" r="140" fill="#6366f1" class="pulsing-orb-1" filter="url(#glow)" opacity=".3"/><circle cx="1020" cy="270" r="160" fill="#ec4899" class="pulsing-orb-2" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="330" r="120" fill="#06b6d4" filter="url(#glow)" opacity=".2"/><g opacity=".35"><path fill="none" stroke="#6366f1" stroke-width="2" d="M 80,180 Q 250,50 450,160 T 800,140 T 1150,220" class="flow-line"/><path fill="none" stroke="#8b5cf6" stroke-width="1.5" d="M 50,260 Q 300,320 580,240 T 950,270 T 1160,110" class="flow-line" style="animation-direction:reverse"/></g><g class="floating-card-1" opacity=".85"><rect width="210" height="90" x="940" y="45" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleGlow)" rx="14"/><circle cx="970" cy="72" r="12" fill="#38bdf8" opacity=".8"/><text x="965" y="77" fill="#fff" font-size="14" font-weight="bold">📄</text><rect width="125" height="8" x="995" y="65" fill="#94a3b8" opacity=".7" rx="4"/><rect width="85" height="6" x="995" y="82" fill="#64748b" opacity=".6" rx="3"/><text x="968" y="116" fill="#38bdf8" font-size="11" font-weight="600">Sync: Real-time Wiki</text></g><g class="floating-card-2" opacity=".85"><rect width="220" height="95" x="50" y="215" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#subtleGlow)" rx="14"/><circle cx="80" cy="245" r="12" fill="#a855f7" opacity=".8"/><text x="75" y="250" fill="#fff" font-size="14" font-weight="bold">🧠</text><rect width="130" height="8" x="105" y="238" fill="#cbd5e1" opacity=".7" rx="4"/><rect width="90" height="6" x="105" y="255" fill="#64748b" opacity=".6" rx="3"/><text x="78" y="290" fill="#c084fc" font-size="11" font-weight="600">Single Source of Truth</text></g><g id="foreground-content"><g class="pulse-pill-1"><rect width="320" height="32" x="440" y="32" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity=".95" rx="16"/><circle cx="458" cy="48" r="5" fill="#22c55e"/><text x="472" y="53" fill="#c7d2fe" font-size="12" font-weight="700" letter-spacing="1">CURATED KNOWLEDGE ECOSYSTEM</text></g><text x="600" y="125" fill="url(#accentGrad)" font-size="44" font-weight="900" letter-spacing="-.5" text-anchor="middle">Team Workspace &amp; Knowledge Base</text><text x="600" y="165" fill="#e2e8f0" font-size="18" font-weight="500" opacity=".95" text-anchor="middle">Top SaaS Platforms &amp; Open-Source Self-Hosted Collaborative Wikis</text><text x="600" y="195" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">Document Management • Relational Databases • Async Collaboration • AI Knowledge Hubs</text><g><g class="pulse-pill-1" transform="translate(230, 235)"><rect width="130" height="34" x="0" y="0" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" rx="17"/><text x="65" y="21" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle">📚 Wikis &amp; Docs</text></g><g class="pulse-pill-2" tra