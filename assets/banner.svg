<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c16"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.5deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-0.5deg); }
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 60; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes waveFlow {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pillPulse {
      0%, 100% { opacity: 0.7; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-4px); }
    }

    .pulsing-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 1000px 260px;
    }
    .floating-card-1 {
      animation: floatCard1 7s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 8s ease-in-out infinite;
    }
    .pulse-pill-1 {
      animation: pillPulse 5s ease-in-out infinite;
    }
    .pulse-pill-2 {
      animation: pillPulse 6s ease-in-out infinite 1.5s;
    }
    .pulse-pill-3 {
      animation: pillPulse 5.5s ease-in-out infinite 3s;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 3s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="180" cy="90" r="140" fill="#6366f1" opacity="0.3" filter="url(#glow)" class="pulsing-orb-1" />
  <circle cx="1020" cy="270" r="160" fill="#ec4899" opacity="0.25" filter="url(#glow)" class="pulsing-orb-2" />
  <circle cx="600" cy="330" r="120" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />

  <!-- Animated Background Network / Flow lines -->
  <g opacity="0.35">
    <path d="M 80,180 Q 250,50 450,160 T 800,140 T 1150,220" fill="none" stroke="#6366f1" stroke-width="2" class="flow-line" />
    <path d="M 50,260 Q 300,320 580,240 T 950,270 T 1160,110" fill="none" stroke="#8b5cf6" stroke-width="1.5" class="flow-line" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Aesthetic Elements (Placed neatly on right/sides to never overlap foreground center text) -->
  <g class="floating-card-1" opacity="0.85">
    <!-- Mini Workspace Node Right -->
    <rect x="940" y="45" width="210" height="90" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <circle cx="970" cy="72" r="12" fill="#38bdf8" opacity="0.8"/>
    <text x="965" y="77" font-size="14" fill="#ffffff" font-weight="bold">📄</text>
    <rect x="995" y="65" width="125" height="8" rx="4" fill="#94a3b8" opacity="0.7"/>
    <rect x="995" y="82" width="85" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <text x="968" y="116" font-size="11" fill="#38bdf8" font-weight="600">Sync: Real-time Wiki</text>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <!-- Mini Knowledge Base Node Left -->
    <rect x="50" y="215" width="220" height="95" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#subtleGlow)"/>
    <circle cx="80" cy="245" r="12" fill="#a855f7" opacity="0.8"/>
    <text x="75" y="250" font-size="14" fill="#ffffff" font-weight="bold">🧠</text>
    <rect x="105" y="238" width="130" height="8" rx="4" fill="#cbd5e1" opacity="0.7"/>
    <rect x="105" y="255" width="90" height="6" rx="3" fill="#64748b" opacity="0.6"/>
    <text x="78" y="290" font-size="11" fill="#c084fc" font-weight="600">Single Source of Truth</text>
  </g>

  <!-- FOREGROUND: Content Area (Centered & Guaranteed in Foreground) -->
  <g id="foreground-content">
    <!-- Top Category Tag / Pill -->
    <g class="pulse-pill-1">
      <rect x="440" y="32" width="320" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.95"/>
      <circle cx="458" cy="48" r="5" fill="#22c55e" />
      <text x="472" y="53" font-size="12" font-weight="700" fill="#c7d2fe" letter-spacing="1">CURATED KNOWLEDGE ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient fill -->
    <text x="600" y="125" text-anchor="middle" font-size="44" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
      Team Workspace &amp; Knowledge Base
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" text-anchor="middle" font-size="18" font-weight="500" fill="#e2e8f0" opacity="0.95">
      Top SaaS Platforms &amp; Open-Source Self-Hosted Collaborative Wikis
    </text>

    <text x="600" y="195" text-anchor="middle" font-size="14" font-weight="400" fill="#94a3b8">
      Document Management • Relational Databases • Async Collaboration • AI Knowledge Hubs
    </text>

    <!-- Dynamic Tags / Pills Bar below Subtitle -->
    <g transform="translate(230, 235)">
      <!-- Pill 1 -->
      <g class="pulse-pill-1">
        <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
        <text x="65" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#93c5fd">📚 Wikis &amp; Docs</text>
      </g>

      <!-- Pill 2 -->
      <g class="pulse-pill-2" transform="translate(145, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
        <text x="72" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#6ee7b7">🚀 Open Source</text>
      </g>

      <!-- Pill 3 -->
      <g class="pulse-pill-3" transform="translate(305, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
        <text x="67" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#fde68a">⚡ Enterprise SaaS</text>
      </g>

      <!-- Pill 4 -->
      <g class="pulse-pill-1" transform="translate(455, 0)">
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1.2"/>
        <text x="70" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#fbcfe8">🔒 Self-Hosted</text>
      </g>

      <!-- Pill 5 -->
      <g class="pulse-pill-2" transform="translate(610, 0)">
        <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2"/>
        <text x="65" y="21" text-anchor="middle" font-size="13" font-weight="600" fill="#c4b5fd">🤖 AI Search</text>
      </g>
    </g>

    <!-- Bottom Accent Border Line -->
    <rect x="250" y="310" width="700" height="2" rx="1" fill="url(#accentGrad)" opacity="0.6"/>
  </g>
</svg>
